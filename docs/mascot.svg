<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 160 130" width="160" height="130" role="img" aria-label="CloudBot mascot">
  <style>
    .eyes {
      animation: blink 4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes blink {
      0%, 94%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .eyes { animation: none; }
    }
  </style>
  <g fill="#1a7cff" stroke="none">
    <circle cx="40" cy="68" r="30"/>
    <circle cx="72" cy="46" r="36"/>
    <circle cx="104" cy="66" r="28"/>
    <rect x="12" y="66" width="118" height="40" rx="20"/>
  </g>
  <g class="eyes" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <path d="M43 70 Q52 60 61 70"/>
    <path d="M79 70 Q88 60 97 70"/>
  </g>
</svg>
