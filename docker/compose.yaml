name: cloudbot

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  hub:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cloudbot:local
    command: ["node", "dist/hub/main.js"]
    environment:
      NODE_ENV: production
      CLOUDBOT_DOMAIN: ${CLOUDBOT_DOMAIN:-localhost}
      CLOUDBOT_LOGIN_ALLOWED_IPS: ${CLOUDBOT_LOGIN_ALLOWED_IPS:-}
      HUB_DATA_DIR: /var/lib/cloudbot-hub
      DOCKER_API_URL: http://docker-guard:2375
      HUB_CONTAINER_ID: cloudbot-hub-1
      CLOUDBOT_INSTANCE_IMAGE: cloudbot:local
      CLOUDBOT_INSTANCE_MEMORY_MB: ${CLOUDBOT_INSTANCE_MEMORY_MB:-2560}
      CLOUDBOT_INSTANCE_BUDGET_MB: ${CLOUDBOT_INSTANCE_BUDGET_MB:-10240}
      CLOUDBOT_INSTANCE_CPUS: ${CLOUDBOT_INSTANCE_CPUS:-2}
      CLOUDBOT_OWNER_NAME: ${CLOUDBOT_OWNER_NAME:-owner}
      CLOUDBOT_IDLE_MINUTES: ${CLOUDBOT_IDLE_MINUTES:-5}
      CLOUDBOT_GOOGLE_CLIENT_ID: ${CLOUDBOT_GOOGLE_CLIENT_ID:-}
      CLOUDBOT_GOOGLE_CLIENT_SECRET: ${CLOUDBOT_GOOGLE_CLIENT_SECRET:-}
    restart: unless-stopped
    # The hub runs as the cloudbot user, owns its data and listens on a high port, so it needs no capability.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 4096
    logging: *logging
    volumes:
      - hub-data:/var/lib/cloudbot-hub
    networks:
      - default
      - hubctl
    depends_on:
      docker-guard:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/internal/health').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Lets through only the Docker requests the hub makes, for CloudBot names, the CloudBot image and its own volumes.
  docker-guard:
    image: cloudbot:local
    command: ["node", "dist/hub/dockerGuardMain.js"]
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 256
    logging: *logging
    environment:
      DOCKER_GUARD_UPSTREAM: http://docker-proxy:2375
      CLOUDBOT_INSTANCE_IMAGE: cloudbot:local
      HUB_CONTAINER_ID: cloudbot-hub-1
    expose:
      - "2375"
    # The image checks the CloudBot server on port 3000. The guard is healthy when it answers at all.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2375/_ping').then(() => process.exit(0), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - hubctl
      - dockerctl
    depends_on:
      docker-proxy:
        condition: service_started

  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    pids_limit: 4096
    logging: *logging
    environment:
      AUTH: "0"
      SECRETS: "0"
      POST: "1"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      CONTAINERS: "1"
      DISTRIBUTION: "0"
      EXEC: "0"
      IMAGES: "0"
      INFO: "0"
      NETWORKS: "1"
      NODES: "0"
      PLUGINS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "1"
      VERSION: "0"
      DELETE: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    networks:
      - dockerctl

  caddy:
    image: caddy:2
    entrypoint: ["/bin/sh", "-c"]
    restart: unless-stopped
    pids_limit: 4096
    logging: *logging
    depends_on:
      hub:
        condition: service_healthy
    environment:
      CLOUDBOT_DOMAIN: ${CLOUDBOT_DOMAIN:-localhost}
    command: ["if [ \"$$CLOUDBOT_DOMAIN\" = localhost ]; then exec caddy run --config /etc/caddy/Caddyfile.local; else exec caddy run --config /etc/caddy/Caddyfile; fi"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.local:/etc/caddy/Caddyfile.local:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default

volumes:
  hub-data:
    name: hub-data
  caddy-data:
  caddy-config:

networks:
  default:
  hubctl:
    internal: true
  dockerctl:
    internal: true
