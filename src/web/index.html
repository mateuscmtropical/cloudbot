<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <title>CloudBot</title>
        <!-- The tab icon is the cloud mascot. The app swaps the svg link for the working and unread faces.
             The svg link comes last with sizes="any", so browsers that support svg icons pick it. -->
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
        <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" data-tab-icon />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./main.tsx"></script>
    </body>
</html>
