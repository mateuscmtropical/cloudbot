name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  docker:
    name: Build image and check isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker compose -f docker/compose.yaml config --quiet

      - run: docker build -f docker/Dockerfile -t cloudbot:ci .

      - name: Start the container
        run: >
          docker run -d --name cloudbot-ci -p 3000:3000
          --health-interval=2s --health-start-period=2s
          -v cloudbot-ci-data:/var/lib/cloudbot
          -v cloudbot-ci-home:/home/bot
          -v cloudbot-ci-workspaces:/var/lib/cloudbot-workspaces cloudbot:ci

      - name: Check health route and data folder isolation
        run: bash docker/check-container.sh cloudbot-ci 3000

      - name: Show container logs on failure
        if: failure()
        run: docker logs cloudbot-ci

  shellcheck:
    name: ShellCheck the shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: shellcheck docker/install.sh docker/cloudbot docker/check-container.sh docker/cloudbot-desktop

  install:
    name: Run install.sh on a fresh runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Copy the checkout to the install folder
        run: sudo cp -a "$GITHUB_WORKSPACE" /opt/cloudbot

      - name: Run install.sh against the checkout
        run: sudo CLOUDBOT_SKIP_CLONE=1 bash /opt/cloudbot/docker/install.sh localhost | tee install.log

      - name: Check the setup link printed by install.sh
        run: grep -F 'https://localhost/setup?code=' install.log

      - name: Check the setup link from cloudbot setup-link
        run: |
          sudo cloudbot status
          sudo cloudbot setup-link | tee setup-link.log
          grep -F 'https://localhost/setup?code=' setup-link.log

      - name: Check the health route through Caddy
        run: curl -ksf --retry 10 --retry-delay 3 --retry-all-errors https://localhost/api/health

      - name: Show container logs on failure
        if: failure()
        run: sudo docker compose -f /opt/cloudbot/docker/compose.yaml --env-file /opt/cloudbot/.env logs
