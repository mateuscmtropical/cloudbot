name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  codex-canary:
    name: Codex canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The version must match CODEX_PROTOCOL_VERSION in src/server/agent/codexProtocol.ts. A unit test checks it.
      - run: npm install --global @openai/codex@0.163.0

      # The canary talks only to a fake model server and the loopback tool server on this runner.
      # An empty path would skip the canary and pass, so the step checks the binary first.
      - run: |
          CODEX_CANARY_PATH="$(command -v codex)"
          test -x "$CODEX_CANARY_PATH"
          CODEX_CANARY_PATH="$CODEX_CANARY_PATH" pnpm canary:codex

  docker:
    name: Build image and check isolation (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - run: docker compose -f docker/compose.yaml config --quiet

      - run: docker build -f docker/Dockerfile -t cloudbot:ci .

      - name: Start the standalone container
        run: >
          docker run -d --name cloudbot-ci -p 3000:3000
          --health-interval=2s --health-start-period=2s
          -v cloudbot-ci-data:/var/lib/cloudbot
          -v cloudbot-ci-home:/home/bot
          -v cloudbot-ci-workspaces:/var/lib/cloudbot-workspaces cloudbot:ci

      - name: Start the hub stack
        run: |
          printf 'CLOUDBOT_DOMAIN=localhost\nCLOUDBOT_OWNER_NAME=owner\n' > .env
          docker compose -f docker/compose.yaml --env-file .env config --quiet
          docker compose -f docker/compose.yaml --env-file .env up -d --build

      - name: Check health, isolation and socket proxy rules
        run: |
          HUB_CONTAINER_ID="$(docker compose -f docker/compose.yaml --env-file .env ps -q hub)"
          bash docker/check-container.sh cloudbot-ci 3000 "$HUB_CONTAINER_ID"

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs cloudbot-ci 2>&1 | sed -E -e 's/(Owner [^ ]+ password: ).*/\1[redacted]/' -e 's#(/setup\?code=)[A-Za-z0-9_-]+#\1[redacted]#g'
          docker compose -f docker/compose.yaml --env-file .env logs --no-color caddy docker-proxy
          docker compose -f docker/compose.yaml --env-file .env logs --no-color hub | sed -E 's/(Owner [^ ]+ password: ).*/\1[redacted]/'

  shellcheck:
    name: ShellCheck the shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: shellcheck docker/install.sh docker/cloudbot docker/check-container.sh docker/cloudbot-desktop docker/cloudbot-remove-workspace docker/cloudbot-read-memory docker/cloudbot-end-turn

  powershell:
    name: Check the PowerShell installer (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Windows x64
            runner: windows-latest
          - arch: Windows ARM
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Parse and lint docker/install.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/docker/install.ps1", [ref]$null, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { $parseErrors; exit 1 }
          $findings = Invoke-ScriptAnalyzer -Path docker/install.ps1 -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost
          $findings | Format-Table RuleName, Line, Message
          if ($findings.Count -gt 0) { exit 1 }

      - name: Check that a bad owner name is refused
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          powershell -NoProfile -ExecutionPolicy Bypass -File docker/install.ps1 -OwnerName Bad_Name 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'The installer accepted a bad owner name.' }
          exit 0
  install:
    name: Run install.sh on a fresh runner (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Copy the checkout to the install folder
        run: sudo cp -a "$GITHUB_WORKSPACE" /opt/cloudbot

      - name: Run install.sh against the checkout
        run: sudo CLOUDBOT_SKIP_CLONE=1 bash /opt/cloudbot/docker/install.sh localhost owner > install.log

      - name: Check the owner address and first password
        run: |
          grep -Fx 'Owner address: http://owner.localhost' install.log
          grep -Eq '^Owner owner password: [A-Za-z0-9_-]+$' install.log
          grep -F 'Change this password at the first sign-in.' install.log

      - name: Check status and reset-password command
        run: |
          sudo cloudbot status
          sudo cloudbot reset-password owner > reset-password.log
          test -s reset-password.log

      - name: Check the sign-in page and the closed internal routes through Caddy
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://owner.localhost/ | grep -F 'Sign in to open your CloudBot'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://owner.localhost/internal/health)" = 404

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -f /opt/cloudbot/docker/compose.yaml --env-file /opt/cloudbot/.env logs --no-color caddy docker-proxy
          docker compose -f /opt/cloudbot/docker/compose.yaml --env-file /opt/cloudbot/.env logs --no-color hub | sed -E 's/(Owner [^ ]+ password: ).*/\1[redacted]/'
